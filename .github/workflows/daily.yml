name: Daily Update

on:
  schedule:
    # 北京时间每天 03:00 = UTC 19:00
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      LANG: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all crawlers
        run: python crawlers/run_all.py
        continue-on-error: true

      - name: Merge crawled → _race_data.js
        run: python scripts/merge_all.py
        continue-on-error: true

      - name: Refresh status + HTML
        run: node daily_update.js

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(daily): update races for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 提示网页地址
        if: always()
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          REPO=${GITHUB_REPOSITORY##*/}
          URL="https://${OWNER}.github.io/${REPO}/"
          echo "::notice title=网页地址::$URL"
          {
            echo "## 🌐 网页地址"
            echo ""
            echo "$URL"
            echo ""
            echo "> 打不开就表示 Pages 还没开启：仓库 Settings → Pages → Source 选 \`Deploy from a branch\`，Branch 选 \`main\` + \`/ (root)\`。"
          } >> "$GITHUB_STEP_SUMMARY"
